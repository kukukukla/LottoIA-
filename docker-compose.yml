version: '3.8'

services:
  app:
    build: .
    container_name: loterias-app
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
      - SESSION_SECRET=${SESSION_SECRET:?Defina SESSION_SECRET no ambiente}
      - ADMIN_USERNAME=${ADMIN_USERNAME:?Defina ADMIN_USERNAME no ambiente}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no ambiente}
    command: uvicorn app:app --host 0.0.0.0 --port 5000

