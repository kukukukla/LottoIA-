services:
  app:
    build: .
    container_name: lottoia-app
    ports:
      - "127.0.0.1:${APP_PORT:-5000}:5000"
    volumes:
      - lottoia_data:/app/data
    environment:
      PYTHONPATH: /app
      LOTTO_DB_PATH: /app/data/lottoia.sqlite3
      SESSION_SECRET: ${SESSION_SECRET:?Configure SESSION_SECRET em .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Configure ADMIN_USERNAME em .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configure ADMIN_PASSWORD em .env}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
    restart: unless-stopped

volumes:
  lottoia_data:
    name: lottoia_data
