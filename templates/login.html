<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Motor Estatístico de Loterias</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">

    <!-- ╔══════════════════════════════════════╗
         ║  ÁREA DE LOGO E MARCA                ║
         ║  Substitua o bloco abaixo pela sua   ║
         ║  imagem de logo real.                ║
         ╚══════════════════════════════════════╝ -->
    <div class="logo-area">
      <div class="logo-placeholder" id="logoContainer">
        <!--
          PARA ADICIONAR SEU LOGO:
          Substitua o conteúdo abaixo por:
          <img src="/static/images/logo.png" alt="Logo">
        -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48
                   10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
        </svg>
        <span class="logo-hint">Logo</span>
      </div>

      <!--
        NOME DA MARCA — edite aqui:
      -->
      <div class="brand-name">⚡ LotoIA</div>
      <div class="brand-tagline">Motor Estatístico de Loterias v2.0</div>
    </div>

    <div class="login-title">Acesso ao Sistema</div>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login" autocomplete="off">
      <div class="form-group">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username"
               placeholder="Digite seu usuário" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password"
               placeholder="Digite sua senha" required>
      </div>
      <button class="btn-login" type="submit">Entrar</button>
    </form>

    <!-- Credenciais de teste (remova em produção) -->
    <div class="demo-creds">
      <strong>🔑 Credenciais de teste:</strong><br>
      admin / loterias2024 &nbsp;·&nbsp; demo / demo123
    </div>

  </div>
</div>
</body>
</html>
